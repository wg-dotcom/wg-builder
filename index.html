<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>White Glove Builder moved — Sagan</title>
  <meta http-equiv="refresh" content="2;url=https://wg-dotcom.github.io/rt-builder/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#F5F2ED;--paper:#FFFCF7;--glacier:#093A3E;--dandelion:#F5B800;--ink:#122E30;--muted:#657170;--line:#D8D4CC}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream);color:var(--ink);font-family:'Space Grotesk',sans-serif}
    main{width:min(680px,100%);padding:42px;background:var(--paper);border:1px solid var(--line);border-radius:24px}
    .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:20px;color:var(--glacier);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}.eyebrow:before{content:'';width:28px;height:3px;background:var(--dandelion)}
    h1{margin:0 0 18px;font:800 clamp(34px,7vw,58px)/1.04 'Plus Jakarta Sans',sans-serif;letter-spacing:-.04em}p{margin:0 0 26px;color:var(--muted);font-size:17px;line-height:1.6}
    a{display:inline-flex;min-height:48px;align-items:center;padding:12px 20px;border-radius:999px;background:var(--dandelion);color:var(--glacier);font-weight:600;text-decoration:none}a:hover{background:var(--glacier);color:#fff}
  </style>
  <script>
    const target='https://wg-dotcom.github.io/rt-builder/'+location.search+location.hash;
    setTimeout(()=>location.replace(target),250);
  </script>
</head>
<body>
  <main>
    <div class="eyebrow">One Sagan builder</div>
    <h1>White Glove now uses Recruiting Builder.</h1>
    <p>Your old link still works. We moved Core and White Glove into one stronger tool, with the same résumé checks, editable preview, and publishing flow.</p>
    <a id="continueLink" href="https://wg-dotcom.github.io/rt-builder/">Open Recruiting Builder</a>
  </main>
  <script>document.getElementById('continueLink').href=target;</script>
</body>
</html>
